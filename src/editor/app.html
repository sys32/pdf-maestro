<title>PDF Maestro Edit Lab</title>
%%FAVICON%%
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: page canvas with clickable text lines on the left; changes and save on the right. Same visual system as PDF Maestro. */
:root{
  --bg:#f5f5f6; --surface:#ffffff; --sunken:#f0f0f2; --line:#e6e6ea; --line-strong:#d2d2d8;
  --fg:#18181b; --muted:#6c6c76; --faint:#9a9aa3;
  --primary:#18181b; --primary-ink:#ffffff;
  --accent:#ea6a1f; --accent-soft:#fdf0e7;
  --ok:#17803d; --ok-soft:#e8f5ec; --ok-line:rgba(23,128,61,.28);
  --warn:#b45309; --warn-soft:#fdf3e1; --warn-line:rgba(217,119,6,.7);
  --no:#6c6c76; --no-line:rgba(108,108,118,.45);
  --danger:#c8282e; --danger-soft:#fdecec;
  --field:#2563eb; --field-soft:rgba(37,99,235,.08);
  --shadow:0 1px 2px rgba(24,24,27,.05),0 4px 16px -6px rgba(24,24,27,.08);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e10; --surface:#17171a; --sunken:#1f1f23; --line:#29292e; --line-strong:#3a3a41;
  --fg:#f2f2f4; --muted:#a0a0aa; --faint:#6f6f79; --primary:#f2f2f4; --primary-ink:#17171a;
  --accent:#ff8a45; --accent-soft:#2c1c12; --ok:#4cc27a; --ok-soft:#14261b; --warn:#f0a73c; --warn-soft:#2c2112; --no:#a0a0aa;
  --danger:#ff6b70; --danger-soft:#2c1517; --field:#6b9bff; --field-soft:rgba(107,155,255,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px -8px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0e10; --surface:#17171a; --sunken:#1f1f23; --line:#29292e; --line-strong:#3a3a41;
  --fg:#f2f2f4; --muted:#a0a0aa; --faint:#6f6f79; --primary:#f2f2f4; --primary-ink:#17171a;
  --accent:#ff8a45; --accent-soft:#2c1c12; --ok:#4cc27a; --ok-soft:#14261b; --warn:#f0a73c; --warn-soft:#2c2112; --no:#a0a0aa;
  --danger:#ff6b70; --danger-soft:#2c1517; --field:#6b9bff; --field-soft:rgba(107,155,255,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px -8px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 48px;padding-inline:20px;display:grid;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:10px;flex:none;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.logo svg{width:100%;height:100%;display:block}
.brand h1{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);letter-spacing:0}
.brand p{margin:0;color:var(--muted);font-size:13px}
@media (max-width:560px){.brand p{display:none}}
.lang{flex:none;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;box-shadow:var(--shadow)}
.lang button{border:0;background:none;padding:6px 10px;border-radius:7px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);cursor:pointer}
.lang button[aria-checked="true"]{background:var(--sunken);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

/* empty state */
.drop{position:relative;border:1.5px dashed var(--line-strong);border-radius:16px;padding:56px 20px;display:grid;justify-items:center;gap:10px;text-align:center;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop-ico{width:56px;height:56px;border-radius:14px;background:var(--sunken);display:grid;place-items:center}
.drop-ico svg{width:24px;height:24px}
.drop strong{font-size:17px;font-weight:600}
.drop small{color:var(--muted);max-width:52ch}
.btn-o{border:1px solid var(--line-strong);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px;background:var(--surface);cursor:pointer}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.how{grid-template-columns:1fr}}
.how div{padding:14px 16px;display:grid;gap:4px}
.how b{display:flex;align-items:center;gap:8px;font-weight:600}
.how span{color:var(--muted);font-size:13px}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.sw.ok{border:2px solid var(--ok)}.sw.warn{border:2px solid var(--warn);background:var(--warn-soft)}.sw.no{background:repeating-linear-gradient(-45deg,var(--no-line) 0 2px,transparent 2px 5px);border:1px solid var(--no-line)}
.sw.field{border:2px solid var(--field);background:var(--field-soft)}

/* workspace */
.ws{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:980px){.ws{grid-template-columns:1fr}}
.stage{display:grid;gap:10px;min-width:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 10px}
.fname{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.fname b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fileico{width:26px;height:32px;flex:none;border-radius:4px;background:var(--sunken);border:1px solid var(--line);display:grid;place-items:end center;padding-bottom:3px;font-size:7px;font-weight:700;color:var(--danger)}
.nav{display:flex;align-items:center;gap:4px}
.ib{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.ib:hover:not(:disabled){border-color:var(--line-strong);background:var(--sunken)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:15px;height:15px}
.pgno{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:64px;text-align:center}
.seg{display:flex;background:var(--sunken);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:5px 10px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.scroller{overflow:auto;padding:22px;border-radius:14px;background:var(--sunken);border:1px solid var(--line);display:grid;justify-content:center;min-height:320px}
.page{position:relative;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);line-height:0}
.page canvas{display:block}
.ov{position:absolute;inset:0}
.ln{position:absolute;border-radius:3px;cursor:text;outline:1.5px solid transparent;outline-offset:1px;transition:outline-color .1s,background .1s}
.show-marks .ln.ok{outline-color:var(--ok-line)}
.ln.ok:hover{outline-color:var(--ok);background:rgba(23,128,61,.07)}
.ln.ed{outline:2px solid var(--ok)}
.ln.ed.sub{outline-color:var(--warn)}
.ln.ok{touch-action:none}
.ln.sel{outline:2px solid var(--accent)!important;background:rgba(234,106,31,.10)!important}
.ln.dragging{z-index:6;cursor:grabbing;outline:2px solid var(--accent)!important;box-shadow:0 6px 18px rgba(0,0,0,.25);background:#fff}
.ln .ghost{position:absolute;inset:1px 2px;pointer-events:none}
.hole{position:absolute;background:#fff;pointer-events:none}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 12px;border-radius:11px;background:var(--accent-soft);font-size:13px}
.selbar b{font-weight:600}
.selbar .sp{flex:1}
.ln.no{cursor:not-allowed}
.show-marks .ln.no{background:repeating-linear-gradient(-45deg,var(--no-line) 0 2px,transparent 2px 6px);outline:1px solid var(--no-line)}
.ln.no:hover{background:repeating-linear-gradient(-45deg,var(--no-line) 0 2px,transparent 2px 6px)}
.ln .badge{position:absolute;top:-9px;right:-9px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;line-height:1}
.ln.sub .badge{background:var(--warn)}
.ln .badge svg{width:9px;height:9px}
.fld{position:absolute;border:1.5px solid var(--field);background:#fff;border-radius:3px;padding:0 4px;color:#111;font-family:Helvetica,Arial,sans-serif;line-height:1}
.fld.chk{padding:0;display:grid;place-items:center;cursor:pointer}
.fld.chk input{margin:0;width:70%;height:70%;accent-color:var(--field);cursor:pointer}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--primary);color:var(--primary-ink);font-size:12px;line-height:1.35;padding:6px 9px;border-radius:7px;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:11px;background:var(--warn-soft);font-size:13px}
.banner svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--warn)}

/* inline editor */
.ed-box{position:absolute;z-index:5;line-height:normal}
.ed-in{position:absolute;border:2px solid var(--accent);border-radius:4px;background:#fff;color:#111;padding:1px 4px;outline:none;box-shadow:0 0 0 4px rgba(234,106,31,.18);font-family:Helvetica,Arial,sans-serif;line-height:1.25;resize:none;overflow:hidden;white-space:pre;display:block}
.ed-pop{position:absolute;display:grid;gap:8px;width:max-content;max-width:min(560px,calc(100vw - 32px));padding:10px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 12px 32px -8px rgba(0,0,0,.35);font-size:12.5px;line-height:1.4;color:var(--fg)}
.st{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:8px}
.st.ok{background:var(--ok-soft)}.st.warn{background:var(--warn-soft)}
.st i{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px}
.st.ok i{background:var(--ok)}.st.warn i{background:var(--warn)}
.st b{font-weight:600}
.st span{color:var(--muted)}
.pop-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pop-row .lbl{color:var(--muted);font-size:12px}
.seg.sm button{padding:4px 8px;display:grid;place-items:center}
.seg.sm svg{width:14px;height:12px}
.acts{display:flex;gap:6px;justify-content:flex-end}
.b{border:0;border-radius:8px;padding:7px 12px;font-weight:600;font-size:12.5px;cursor:pointer}
.b.pri{background:var(--primary);color:var(--primary-ink)}
.b.ghost{background:none;color:var(--muted)}
.b.ghost:hover{background:var(--sunken);color:var(--fg)}
.keys{color:var(--faint);font-size:11px}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tb{height:30px;min-width:30px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;font-size:13px;color:var(--fg)}
.tb:hover{border-color:var(--line-strong);background:var(--sunken)}
.tb[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.tb.b1{font-weight:800}.tb.i1{font-style:italic;font-family:Georgia,serif}
.vsep{width:1px;height:20px;background:var(--line)}
.tb.u1{text-decoration:underline}.tb.s1{text-decoration:line-through}.tb.sm1{font-size:12px}
.tb.adv{gap:5px;display:inline-flex;align-items:center;font-size:12px;font-weight:500;color:var(--muted)}
.tb.adv[aria-pressed="true"]{color:var(--primary-ink)}
.tb.adv svg{width:12px;height:12px;transition:transform .15s}.tb.adv[aria-pressed="true"] svg{transform:rotate(180deg)}
.advp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;align-items:start;padding-top:10px;border-top:1px solid var(--line)}
.advp .cell{display:grid;gap:4px;min-width:0}
.advp[hidden]{display:none}
.advp .full{grid-column:1/-1;display:flex;justify-content:flex-end}
@media (max-width:640px){.advp{grid-template-columns:minmax(0,1fr)}}
.advp .lbl{color:var(--muted);font-size:12px;white-space:nowrap}
.advp .row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0}
.advp .tb{white-space:nowrap}
.advp select{min-width:0;max-width:100%;flex:1}
.advp select,.advp input.num{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;font-size:12.5px;padding:0 8px}
.advp input.num{width:64px;font-variant-numeric:tabular-nums}
.advp input[type=range]{width:100%;min-width:80px;flex:1;accent-color:var(--primary)}
.advp .val{min-width:34px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.clr.hl i{background-image:linear-gradient(135deg,transparent 45%,#d33 45%,#d33 55%,transparent 55%)}
.clr.hl.on i{background-image:none}
.size{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:30px}
.size button{width:26px;height:100%;border:0;background:var(--surface);cursor:pointer;color:var(--fg)}
.size button:hover{background:var(--sunken)}
.size input{width:42px;height:100%;border:0;border-inline:1px solid var(--line);text-align:center;font-size:12.5px;background:var(--surface);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.size input::-webkit-inner-spin-button{-webkit-appearance:none}
.clr{position:relative;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.clr input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.clr i{width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.ln.gone{outline:1.5px dashed var(--danger)!important;background:repeating-linear-gradient(-45deg,rgba(200,40,46,.10) 0 3px,transparent 3px 7px)}
.ln.gone .badge{background:var(--danger)}
.tb.del1{color:var(--danger)}.tb.del1:hover{background:var(--danger-soft);border-color:transparent}
.tb svg{width:14px;height:14px}
.ur{display:flex;gap:4px}
.ib.tool[hidden]{display:none}
.ib.tool{width:auto;padding:0 10px;gap:6px;display:inline-flex;font-size:12.5px;font-weight:600}
@media (max-width:760px){.ib.tool span{display:none}.ib.tool{padding:0 8px}}
.ib.tool[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.page.adding,.page.adding .ln{cursor:crosshair}
.ln.add{outline-style:dashed}
.btn.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line-strong)}
.btn.sec:hover:not(:disabled){background:var(--sunken)}
.cobar{display:grid;gap:8px;padding:12px 14px;border-radius:11px;background:var(--accent-soft);border:1px solid rgba(234,106,31,.35);font-size:13px}
.cobar b{font-weight:600}
.cobar .co-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cobar textarea{width:100%;min-height:52px;border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;background:var(--surface);color:var(--fg);resize:vertical}
.cobar .b.pri{padding:7px 14px}
.cobar .warnl{color:var(--warn);font-size:12px}
.cobar .co-list{display:grid;gap:3px}
.cobar .co-it{font-size:12.5px;color:var(--fg);padding-left:2px}
.cobar .co-chk{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}
.cobar .co-chk input{accent-color:var(--accent)}
.coform{border:1px solid var(--line);border-radius:10px;padding:0}
.coform summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.coform summary::-webkit-details-marker{display:none}
.coform summary small{color:var(--muted);font-weight:400;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.coform .cf{display:grid;gap:8px;padding:0 12px 12px}
.coform label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.coform input,.coform textarea{border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;background:var(--surface);color:var(--fg)}
.coform textarea{min-height:64px;resize:vertical}
.coform .cf-row{display:flex;align-items:center;gap:10px}
.coform .cf-row span{font-size:12px;color:var(--ok)}
.fmt{display:inline-flex;gap:3px;margin-left:4px}
.fmt span{padding:0 5px;border-radius:5px;background:var(--sunken);color:var(--fg);font-weight:600}

/* side */
.side{padding:16px;display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
@media (max-width:980px){.side{position:static}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats div{padding:9px 10px;display:grid;gap:1px}
.stats div+div{border-left:1px solid var(--line)}
.stats b{font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:11.5px;color:var(--muted)}
.legend{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.legend div{display:flex;align-items:center;gap:8px}
.sec-t{font-size:12px;font-weight:600;color:var(--muted);margin:0;display:flex;justify-content:space-between;align-items:center}
.changes{display:grid;gap:6px;max-height:340px;overflow:auto}
.ch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;text-align:left;background:var(--surface)}
.ch:hover{border-color:var(--line-strong)}
.ch .old{font-size:12px;color:var(--faint);text-decoration:line-through;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .new{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .meta{grid-column:1/-1;display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.chip{padding:1px 7px;border-radius:99px;font-weight:600;font-size:11px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.del{background:var(--danger-soft);color:var(--danger)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.ch .x{grid-row:1/3;grid-column:2;align-self:start;width:26px;height:26px;border:0;border-radius:7px;background:none;color:var(--faint);display:grid;place-items:center;cursor:pointer}
.ch .x:hover{background:var(--danger-soft);color:var(--danger)}
.ch .x svg{width:12px;height:12px}
.empty-ch{font-size:12.5px;color:var(--faint);padding:10px;border:1px dashed var(--line-strong);border-radius:10px;text-align:center;margin:0}
.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--primary);color:var(--primary-ink);font-weight:600;font-size:14.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.note{font-size:12.5px;color:var(--muted);margin:0}
.status{font-size:12.5px;margin:0;color:var(--muted);min-height:1.2em}
.status.err{color:var(--danger)}.status.ok{color:var(--ok)}
.privacy{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin:0;border-top:1px solid var(--line);padding-top:12px}
.privacy i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);flex:none}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);animation:sp .7s linear infinite;display:inline-block;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      %%LOGO%%

      e.text = ''; delete e.style; delete e.move; st.edits.set(k, e);
    }));
    st.sel.clear(); renderOverlay(); renderChanges(); updateSave(); rebuild();
  }

  /* ---------- fields ---------- */
  let fieldTimer = null;
  function setField(name, v, typing){ if(!typing || hist.typing !== name){ const s0 = snap(); hist.u.push(s0); hist.r.length = 0; updateUndo(); } hist.typing = typing ? name : null; st.fieldVals[name] = v; clearTimeout(fieldTimer); if(typing){ fieldTimer = setTimeout(()=>{ renderChanges(); updateSave(); }, 200); } else { renderChanges(); updateSave(); } }

  /* ---------- build the real output ---------- */
  async function buildOutput(){
    const doc = await PDFLib.PDFDocument.load(st.orig, { ignoreEncryption:true, updateMetadata:false });
    const edits = [...st.edits.values()];
    const rep = edits.length ? await PMEdit.applyEdits(doc, edits.map(e => ({ page:e.page, line:e.line, text:e.text, anchor:e.anchor, style:e.style, move:e.move, add:e.add, x:e.x, y:e.y, ref:e.ref })), { fontkit: window.fontkit, fonts: fonts() }) : [];
    const changed = {}; st.fields.forEach(f => { if(f.name in st.fieldVals && st.fieldVals[f.name] !== f.value) changed[f.name] = st.fieldVals[f.name]; });
    if(Object.keys(changed).length) await PMEdit.applyFields(doc, changed, { fontkit: window.fontkit, fonts: fonts() });
    return { bytes: await doc.save(), rep };
  }
  async function rebuild(){
    if(st.building){ st.rebuildQueued = true; return; }
    st.building = true; setStatus('spin'); renderChanges(); updateSave();
    try{
      const { bytes, rep } = await buildOutput();
      st.report = new Map(); rep.forEach(r => st.report.set(key(r.page, r.line), r));
      st.preview = bytes;
      if(pdfjsOK){ const old = st.previewDoc; st.previewDoc = await pdfjsLib.getDocument({ data: bytes.slice(), isEvalSupported:false }).promise; if(old && old !== st.origDoc) old.destroy(); }
      setStatus('');
    }catch(e){ console.error(e); setStatus(t('err', { m: e.message || e }), 'err'); }
    st.building = false;
    if(st.rebuildQueued){ st.rebuildQueued = false; return rebuild(); }
    renderChanges(); updateSave();
    if(!st.showOrig) await showPage();
    verify();
  }
  async function verify(){
    // confirm each edit is really in the saved file's text
    if(!pdfjsOK || !st.previewDoc) return;
    const byPage = {}; st.edits.forEach(e => (byPage[e.page] = byPage[e.page] || []).push(e));
    for(const p in byPage){
      const pg = await st.previewDoc.getPage(+p+1), tc = await pg.getTextContent();
      const all = tc.items.map(i => i.str).join(' ').replace(/\s+/g,' ');
      byPage[p].forEach(e => { e.verified = !e.text || all.includes(e.text.replace(/\s+/g,' ')); });
    }
    renderChanges();
  }

  /* ---------- changes list ---------- */
  function renderChanges(){
    const box = $('changes'); box.textContent = '';
    const list = [...st.edits.values()].sort((a,b)=>a.page-b.page || a.line-b.line);
    const fieldList = st.fields.filter((f,i,arr) => arr.findIndex(g => g.name===f.name)===i && (f.name in st.fieldVals) && st.fieldVals[f.name] !== f.value);
    $('ch-n').textContent = (list.length + fieldList.length) || '';
    if(!list.length && !fieldList.length){ const p = document.createElement('p'); p.className = 'empty-ch'; p.textContent = t('noChanges'); box.appendChild(p); return; }
    list.forEach(e => {
      const rep = st.report.get(key(e.page, e.line));
      const b = document.createElement('div'); b.className = 'ch'; b.tabIndex = 0; b.setAttribute('role','button');
      const sub = rep && rep.mode === 'fallback', rem = rep && rep.mode === 'removed';
      b.innerHTML = '<span class="old"></span><span class="new"></span><button class="x" aria-label="Undo">'+SVG_X+'</button><span class="meta"><span>'+t('page')+' '+(e.page+1)+'</span>'
        + (rep ? '<span class="chip '+(rem ? 'del' : sub ? 'warn' : 'ok')+'">'+(rem ? t('removed') : sub ? t('sub')+' · '+rep.font : t('exact'))+'</span>' : '')
        + fmtChips(e) + (e.verified ? '<span style="color:var(--ok)">'+t('inFile')+'</span>' : '') + '</span>';
      b.querySelector('.old').textContent = e.add ? '＋ ' + t('newText') : e.old; if(e.add) b.querySelector('.old').style.textDecoration = 'none'; b.querySelector('.new').textContent = (e.text || '—').replace(/\n/g, ' ⏎ ');
      b.querySelector('.x').onclick = ev => { ev.stopPropagation(); change(() => st.edits.delete(key(e.page, e.line))); rebuild(); };
      const go = async () => { if(st.page !== e.page){ st.page = e.page; await showPage(); } const ln = lineById(e.page, e.line); if(ln && !st.showOrig) openEditor(ln); };
      b.onclick = go; b.onkeydown = ev => { if(ev.key==='Enter'){ ev.preventDefault(); go(); } };
      box.appendChild(b);
    });
    fieldList.forEach(f => {
      const v = st.fieldVals[f.name];
      const b = document.createElement('div'); b.className = 'ch';
      b.innerHTML = '<span class="old"></span><span class="new"></span><button class="x" aria-label="Undo">'+SVG_X+'</button><span class="meta"><span>'+t('page')+' '+(f.page+1)+' · '+t('field')+'</span></span>';
      b.querySelector('.old').textContent = f.kind==='check' ? (f.value ? '☑' : '☐') + ' ' + f.name : (f.value || f.name);
      b.querySelector('.new').textContent = f.kind==='check' ? (v ? '☑' : '☐') + ' ' + f.name : (v || '—');
      b.querySelector('.x').onclick = ev => { ev.stopPropagation(); change(() => { delete st.fieldVals[f.name]; }); renderChanges(); updateSave(); renderOverlay(); };
      b.onclick = async () => { if(st.page !== f.page){ st.page = f.page; await showPage(); } };
      box.appendChild(b);
    });
  }
  function fmtChips(e){
    const s = e.style || {}, out = [];
    if(s.bold === true) out.push('<b>B</b>'); if(s.bold === false) out.push('<s>B</s>');
    if(s.italic === true) out.push('<i>I</i>'); if(s.italic === false) out.push('<s>I</s>');
    if(s.underline) out.push('<u>U</u>'); if(s.strike) out.push('<s>S</s>');
    if(s.size) out.push(s.size + 'pt');
    if(s.family) out.push(t(s.family==='mono' ? 'fMono' : s.family==='serif' ? 'fSerif' : 'fSans'));
    if(s.highlight) out.push('<i style="display:inline-block;width:12px;height:9px;border-radius:2px;background:'+s.highlight+'"></i>');
    if(s.baseline) out.push(s.baseline==='super' ? 'x²' : 'x₂');
    if(s.tracking) out.push('↔ ' + s.tracking + 'pt');
    if(s.hscale) out.push(s.hscale + '%');
    if(s.leading) out.push('↕ ' + s.leading + '×');
    if(s.opacity) out.push(Math.round(s.opacity*100) + '% ' + t('opacity').toLowerCase());
    if(s.color) out.push('<i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+s.color+'"></i>');
    if(/\n/.test(e.text)) out.push(e.text.split('\n').length + ' ' + t('linesW'));
    if(e.move && (Math.abs(e.move.dx) > 0.01 || Math.abs(e.move.dy) > 0.01)) out.push('✥ ' + t('movedW'));
    return out.length ? '<span class="fmt">' + out.map(x => '<span>'+x+'</span>').join('') + '</span>' : '';
  }
  function updateSave(){
    const fieldChanged = st.fields.some(f => (f.name in st.fieldVals) && st.fieldVals[f.name] !== f.value);
    $('save').disabled = st.building || (!st.edits.size && !fieldChanged);
    $('apply').hidden = !(EMBED && window.PMEditor && PMEditor.onApply);
    $('apply').disabled = $('save').disabled;
    $('save').classList.toggle('sec', !$('apply').hidden);
  }

  /* ---------- save ---------- */
  async function save(){
    const name = st.name.replace(/\.pdf$/i,'') + (lang==='mk' ? ' - уреден' : ' - edited') + '.pdf';
    $('save').disabled = true; setStatus('spin');
    try{
      const { bytes } = await buildOutput();
      const blob = new Blob([bytes], { type:'application/pdf' });
      if('showSaveFilePicker' in window){
        try{
          const h = await window.showSaveFilePicker({ suggestedName:name, types:[{ description:'PDF', accept:{'application/pdf':['.pdf']} }] });
          const w = await h.createWritable(); await w.write(blob); await w.close(); setStatus(t('saved', { name:h.name }), 'ok'); updateSave(); return;
        }catch(e){ if(e && e.name==='AbortError'){ setStatus(''); updateSave(); return; } }
      }
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if(dl){ try{ await dl.save({ filename:name, data:blob }); setStatus(t('saved', { name }), 'ok'); }catch(e){ if(e && e.code==='declined') setStatus(t('dlCancel')); else throw e; } }
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000); setStatus(t('saved', { name }), 'ok'); }
    }catch(e){ setStatus(t('err', { m: e.message || e }), 'err'); }
    updateSave();
  }

  /* ---------- wiring ---------- */
  if(!EMBED){
    const fileIn = $('file');
    fileIn.onchange = e => { openFile(e.target.files[0]); fileIn.value = ''; };
    const drop = $('drop'); let depth = 0;
    const isFile = e => e.dataTransfer && [...(e.dataTransfer.types||[])].includes('Files');
    document.addEventListener('dragenter', e => { if(!isFile(e)) return; e.preventDefault(); depth++; drop.classList.add('over'); });
    document.addEventListener('dragover', e => { if(isFile(e)) e.preventDefault(); });
    document.addEventListener('dragleave', e => { if(!isFile(e)) return; if(--depth<=0){ depth=0; drop.classList.remove('over'); } });
    document.addEventListener('drop', e => { if(!isFile(e)) return; e.preventDefault(); depth=0; drop.classList.remove('over'); if(e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]); });
    $('other').onclick = () => fileIn.click();
    $('lang-mk').onclick = () => setLang('mk'); $('lang-en').onclick = () => setLang('en');
  }
  $('prev').onclick = async () => { if(st.page>0){ st.page--; st.sel.clear(); await showPage(); } };
  $('next').onclick = async () => { if(st.page<st.pages-1){ st.page++; st.sel.clear(); await showPage(); } };
  $('v-edit').onclick = async () => { st.showOrig = false; $('v-edit').setAttribute('aria-pressed', true); $('v-orig').setAttribute('aria-pressed', false); await showPage(); };
  $('v-orig').onclick = async () => { st.showOrig = true; $('v-edit').setAttribute('aria-pressed', false); $('v-orig').setAttribute('aria-pressed', true); await showPage(); };
  $('z-fit').onclick = async () => { st.zoom='fit'; $('z-fit').setAttribute('aria-pressed', true); $('z-big').setAttribute('aria-pressed', false); await showPage(); };
  $('z-big').onclick = async () => { st.zoom='big'; $('z-fit').setAttribute('aria-pressed', false); $('z-big').setAttribute('aria-pressed', true); await showPage(); };
  $('save').onclick = save;
  $('sel-del').onclick = () => deleteLines([...st.sel]);
  $('undo').onclick = undo; $('redo').onclick = redo;
  $('sel-clear').onclick = () => { st.sel.clear(); renderOverlay(); };
  $('sel-reset').onclick = () => { change(() => [...st.sel].forEach(id => { const m = moveOf(st.page, id); if(m.dx || m.dy) addMove(st.page, id, -m.dx, -m.dy); })); renderOverlay(); renderChanges(); updateSave(); rebuild(); };
  const active = () => !!st.orig && (!EMBED || !$('root').hidden);
  $('ov').addEventListener('click', ev => { if(st.tool === 'text' && !st.showOrig){ const r = $('page').getBoundingClientRect(); ev.stopPropagation(); startAdd(ev.clientX - r.left, ev.clientY - r.top); } }, true);
  $('ov').addEventListener('dblclick', ev => { if(st.showOrig || st.tool || ev.target !== $('ov')) return; const r = $('page').getBoundingClientRect(); startAdd(ev.clientX - r.left, ev.clientY - r.top); });
  $('co-save').onclick = saveCoForm;
  $('scan').onclick = () => scanInvoice(true);
  renderCoForm();
  $('addt').onclick = () => { if(st.showOrig) $('v-edit').click(); setTool(st.tool === 'text' ? null : 'text'); };
  $('apply').onclick = async () => {
    if(!window.PMEditor || !PMEditor.onApply) return;
    $('apply').disabled = true; setStatus('spin');
    try{ await PMEditor.onApply(); setStatus(t('applied'), 'ok'); }catch(e){ setStatus(t('err', { m: e.message || e }), 'err'); }
    updateSave();
  };
  let rz; window.addEventListener('resize', () => { if(!active() || st.zoom!=='fit') return; clearTimeout(rz); rz = setTimeout(showPage, 150); });
  document.addEventListener('keydown', e => {
    if(!active() || st.editing || e.target.matches('input,select,textarea')) return;
    const mod = e.ctrlKey || e.metaKey;
    if(mod && (e.key==='z' || e.key==='Z') && !e.shiftKey){ e.preventDefault(); undo(); return; }
    if(mod && ((e.key==='z' || e.key==='Z') && e.shiftKey || e.key==='y' || e.key==='Y')){ e.preventDefault(); redo(); return; }
    if((e.key==='Delete' || e.key==='Backspace') && !st.showOrig){
      const f = document.activeElement, fid = f && f.classList && f.classList.contains('ln') && f.dataset.id;
      const ids = st.sel.size ? [...st.sel] : fid != null && fid !== undefined && fid !== false ? [+fid] : [];
      if(ids.length){ e.preventDefault(); deleteLines(ids); return; }
    }
    if(st.sel.size && !st.showOrig && e.key.startsWith('Arrow')){
      e.preventDefault(); const step = e.shiftKey ? 10 : 1;
      nudge(e.key==='ArrowLeft' ? -step : e.key==='ArrowRight' ? step : 0, e.key==='ArrowUp' ? step : e.key==='ArrowDown' ? -step : 0);
      return;
    }
    if(e.key==='Escape' && st.tool){ e.preventDefault(); setTool(null); return; }
    if((e.key==='t' || e.key==='T') && !e.ctrlKey && !e.metaKey && !st.showOrig){ e.preventDefault(); setTool(st.tool === 'text' ? null : 'text'); return; }
    if(e.key==='Escape' && st.sel.size){ e.preventDefault(); st.sel.clear(); renderOverlay(); return; }
    if(e.key==='ArrowRight' || e.key==='PageDown') $('next').click();
    if(e.key==='ArrowLeft' || e.key==='PageUp') $('prev').click();
  });
  applyStatic();
  window.__editlab = st;
  if(EMBED){
    // used by PDF Maestro: open bytes in the editor, hand the edited file back
    window.PMEditor = {
      open: (bytes, name, page, opts) => openBytes(bytes, name, page, opts),
      detect: async (bytes) => { try{ const d = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption:true, updateMetadata:false }); const prop = await companyProposal(d, {}, d.getPageCount(), null); return prop ? { page: prop.page, name: !!(prop.fix || prop.lines.includes(getCo().name)), addr: !!prop.addr } : null; }catch(e){ return null; } },
      autoFix,
      onApply: null, onCompanyChange: null,
      getCompany: getCo, setCompany: setCo,
      build: async () => (await buildOutput()).bytes,
      save, setLang, hasChanges: () => st.edits.size > 0 || st.fields.some(f => (f.name in st.fieldVals) && st.fieldVals[f.name] !== f.value),
      close: () => { closeEditor(true); st.sel.clear(); hideTip(); },
      state: st, t
    };
  }
})();
</script>
